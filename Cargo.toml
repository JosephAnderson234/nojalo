[package]
name = "nojalo-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
nojalo-core = { path = "core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[workspace]
members = ["core", "src-tauri"]

# Sin debuginfo en dependencias: el target pesa varias veces menos y compila más rápido.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
