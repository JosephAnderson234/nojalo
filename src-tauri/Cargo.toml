[package]
name = "libreta"
version = "0.1.0"
description = "Libreta de calificaciones"
edition = "2021"

[lib]
name = "libreta_lib"
# Sin "cdylib": solo se necesita para móvil y en MinGW supera el límite de 65k exports.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libreta-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
