[package]
name = "nojalo"
version = "0.1.0"
description = "Calculadora de notas: cuánto necesitas para no jalar"
edition = "2021"

[lib]
name = "nojalo_lib"
# Sin "cdylib": solo se necesita para móvil y en MinGW supera el límite de 65k exports.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nojalo-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
