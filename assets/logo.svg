<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Nojalo</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5753f0"/>
      <stop offset="1" stop-color="#a24bf2"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fondo)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- pista del medidor: 240° desde abajo a la izquierda -->
    <path d="M126.1 347A150 150 0 1 1 385.9 347" stroke="#fff" stroke-opacity=".28" stroke-width="34"/>
    <!-- nota alcanzada: 72 % de la escala -->
    <path d="M126.1 347A150 150 0 0 1 375.5 181.3" stroke="#fff" stroke-width="34"/>
    <!-- marca de la nota aprobatoria (10.5 / 20) -->
    <path d="M268.4 153.7L275.3 87.1" stroke="#19c37d" stroke-width="16"/>
    <!-- aprobado -->
    <path d="M200 286l40 40 76-84" stroke="#fff" stroke-width="32"/>
  </g>
</svg>
